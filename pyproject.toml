[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "create-github-repo"
version = "0.1.0"
description = "A CLI tool to create GitHub repositories from the command line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Ishan Dutta", email = "ishandutta2007@gmail.com"},
]
keywords = ["github", "cli", "repository", "automation", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ishandutta2007/create-github-repo"
Repository = "https://github.com/ishandutta2007/create-github-repo"
Issues = "https://github.com/ishandutta2007/create-github-repo/issues"

[project.scripts]
create-github-repo = "create_github_repo.cli:main"

[tool.setuptools.packages.find]
include = ["create_github_repo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
